<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoamReady AI</title>
<style>
  :root { color-scheme:light; --bg:#fbfaf6; --card:#fffefa; --line:#e5e1d7; --text:#202723; --muted:#68716b; --accent:#187d78; --good:#267259; --warn:#a46528; --soft:#e7f1ed; --font:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }
  .wrap { padding:22px clamp(15px,3vw,34px) 30px; }
  h1 { font-size:clamp(24px,3vw,34px); line-height:1.08; margin:0 0 7px; font-weight:680; letter-spacing:-.045em; }
  .sub { color:var(--muted); font-size:13px; line-height:1.5; margin-bottom:16px; }
  .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:17px; padding:17px; position:relative; }
  .trip-card { padding-top:48px; }
  .card.best { border-color:#9dbeb2; box-shadow:0 7px 22px rgba(30,75,61,.07); }
  .badge { position:absolute; top:13px; right:13px; font-size:10px; padding:5px 9px; border-radius:99px; background:var(--soft); color:#245e58; font-weight:750; letter-spacing:.045em; }
  .price { font-size:28px; font-weight:750; }
  .price small { font-size:13px; color:var(--muted); font-weight:500; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:13px; line-height:1.45; color:var(--muted); margin-top:7px; }
  .strong { color:var(--text); font-weight:600; }
  .photo { width:100%; height:110px; object-fit:cover; border-radius:10px; margin-bottom:10px; background:#1b2640; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  button { flex:1; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; font-size:13px; cursor:pointer; transition:background .16s,border-color .16s; }
  button:hover { background:var(--soft); border-color:#9dbeb2; }
  button.primary { background:var(--accent); color:white; border-color:var(--accent); font-weight:700; }
  button.primary:hover { background:#126a65; }
  button:disabled { opacity:.62; cursor:wait; }
  button:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:130px; margin:8px 0 6px; }
  .bar { flex:1; background:#26406b; border-radius:6px 6px 0 0; position:relative; min-height:6px; }
  .bar.min { background:var(--good); }
  .bar span { position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--muted); white-space:nowrap; }
  .labels { display:flex; gap:6px; font-size:10px; color:var(--muted); }
  .labels div { flex:1; text-align:center; }
  .steps { font-size:12px; color:var(--muted); margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  .steps li { margin:2px 0; }
  .assumptions { margin-top:10px; color:var(--muted); font-size:12px; }
  .assumptions summary { cursor:pointer; color:var(--text); }
  .itinerary-detail { margin-top:8px; color:var(--muted); font-size:12px; }
  .itinerary-detail summary { cursor:pointer; color:var(--text); font-weight:600; }
  .comparison-trips { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; align-items:start; }
  .comparison-trips > .card { min-width:0; }
  .empty { color:var(--muted); padding:40px 12px; text-align:center; background:#f5f4ef; border:1px dashed #d6d2c8; border-radius:14px; }
  .drop { color:var(--good); font-weight:700; }
  .up { color:var(--warn); font-weight:700; }
  .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:10px; font-weight:800; margin:0 0 7px; }
  .disruption { background:#f7f0e5; border-color:#ead8ba; margin:14px 0; }
  .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:15px; }
  .metric { border:1px solid var(--line); background:#fbfaf6; border-radius:12px; padding:12px; min-width:0; }
  .metric span { display:block; color:var(--muted); font-size:11px; line-height:1.35; }
  .metric strong { display:block; margin-top:5px; font-size:17px; letter-spacing:-.03em; }
  .metric em { font-size:11px; font-style:normal; color:var(--good); font-weight:650; }
  .day-nav { display:flex; gap:6px; overflow:auto; padding:2px 0 12px; margin-top:12px; }
  .day-nav button { flex:none; padding:8px 12px; border-radius:999px; font-size:12px; }
  .day-nav button[aria-selected="true"] { background:#dcebe5; border-color:#a8c9bd; color:#205f58; font-weight:750; }
  .day-panel { border-top:1px solid var(--line); padding-top:11px; }
  .activity { display:grid; grid-template-columns:68px minmax(0,1fr) auto; gap:10px; align-items:start; padding:12px 0; border-bottom:1px solid #eeece5; }
  .activity:last-child { border-bottom:0; }
  .activity-time { color:var(--accent); font-size:12px; font-weight:750; }
  .activity h3 { font-size:14px; margin:0; letter-spacing:-.015em; }
  .activity p { color:var(--muted); font-size:11px; line-height:1.45; margin:4px 0 0; }
  .activity-cost { white-space:nowrap; font-weight:700; font-size:12px; }
  .activity.changed { background:#f4f6ef; margin:0 -8px; padding:12px 8px; border-radius:10px; }
  .change-note { color:#7a542c; font-size:11px; margin-top:8px; }
  .data-note { border-left:2px solid var(--accent); padding-left:10px; margin:14px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
  @media (max-width:620px) { .comparison-trips { grid-template-columns:1fr; } .metrics { grid-template-columns:1fr; } .metric { display:flex; justify-content:space-between; align-items:center; gap:10px; } .metric strong { margin:0; text-align:right; } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration:.01ms !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Waiting for RoamReady AI results…</div></div>
<script>
// ---------------------------------------------------------------- MCP Apps bridge (SEP-1865), no SDK needed
let nextId = 1; const pending = {};
function send(msg) { window.parent.postMessage(msg, "*"); }
function request(method, params) {
  const id = nextId++; send({ jsonrpc: "2.0", id, method, params });
  return new Promise((resolve, reject) => { const timer = setTimeout(() => { delete pending[id]; reject(new Error("The local demo did not respond. Try again.")); }, 15000); pending[id] = { resolve: value => { clearTimeout(timer); resolve(value); }, reject: error => { clearTimeout(timer); reject(error); } }; });
}
function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }
window.addEventListener("message", (ev) => {
  const m = ev.data || {};
  if (m.id && pending[m.id] && (m.result !== undefined || m.error)) {
    const p = pending[m.id]; delete pending[m.id];
    m.error ? p.reject(new Error(m.error.message || "error")) : p.resolve(m.result); return;
  }
  if (m.method === "ui/notifications/tool-result") render(m.params);
  if (m.method === "ui/notifications/tool-input") showLoading(m.params && m.params.arguments);
});
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const money = (v, c) => v == null ? "–" : new Intl.NumberFormat("en-IE", { style:"currency", currency:c || "EUR", maximumFractionDigits:0 }).format(v);
const hm = (m) => m == null ? "" : `${Math.floor(m/60)}h ${m%60}m`;
const t = (iso) => { if (!iso) return ""; const d = new Date(iso.length > 10 ? iso : iso + "T00:00"); return d.toLocaleString("en-US", { weekday:"short", hour:"numeric", minute:"2-digit" }); };
const day = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
const app = document.getElementById("app");

function showLoading(args) { app.innerHTML = `<div class="empty">Searching${args && args.destination ? " for " + esc(args.destination) : ""}…</div>`; }

async function openLink(url) { try { await request("ui/open-link", { url }); } catch (e) { window.open(url, "_blank"); } }
async function callTool(name, args, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
  try { const r = await request("tools/call", { name, arguments: args }); if (btn) btn.textContent = "✓ Done"; return r; }
  catch (e) { if (btn) { btn.textContent = "Try again"; btn.disabled = false; } app.insertAdjacentHTML("afterbegin", `<div class="card disruption" role="alert">${esc(e.message || "That action failed. Please try again.")}</div>`); }
}
window.TS = { openLink, callTool };

function flightLine(f) {
  if (!f) return "";
  const stops = f.stops === 0 ? "Nonstop" : `${f.stops} stop${f.stops > 1 ? "s" : ""}${f.layovers && f.layovers.length ? " via " + f.layovers.join(", ") : ""}`;
  return `<div class="row"><span class="strong">${esc((f.airlines || []).join(", "))}</span><span>${esc((f.flightNumbers || []).join(" · "))}</span></div>
          <div class="row"><span>${esc(t(f.departure))} → ${esc(t(f.arrival))}</span></div>
          <div class="row"><span>${hm(f.durationMinutes)} · ${stops}</span><span>${f.co2Kg ? f.co2Kg + " kg CO₂" : ""}</span></div>`;
}

function render(result) {
  const d = (result && result.structuredContent) || {};
  const cur = d.currency || "USD";
  const kind = d.kind;
  let html = `<h1>${esc(d.title || "RoamReady AI")}</h1><div class="sub">${esc(d.subtitle || "")}</div>`;

  if (kind === "packages") {
    html += `<div class="grid">` + (d.packages || []).map((p, i) => `
      <div class="card ${i === 0 ? "best" : ""}">${i === 0 ? '<div class="badge">BEST VALUE</div>' : ""}
        ${p.hotel.photo ? `<img class="photo" src="${esc(p.hotel.photo)}" alt="">` : ""}
        <div class="price">${money(p.total, cur)} <small>total</small></div>
        <div class="row"><span class="strong">${day(p.departureDate)} → ${day(p.returnDate)}</span><span>${p.nights} nights</span></div>
        <div class="row"><span>✈ ${money(p.flightPrice, cur)}</span><span>🏨 ${money(p.hotelPrice, cur)}</span></div>
        ${flightLine(p.flight)}
        <div class="row"><span class="strong">${esc(p.hotel.name)}</span><span>★ ${p.hotel.rating ?? "–"} (${p.hotel.reviewCount ?? 0})</span></div>
        <div class="btns">
          <button onclick='TS.openLink(${JSON.stringify(p.flightsUrl || "")})'>Flights</button>
          <button onclick='TS.openLink(${JSON.stringify(p.hotel.googleHotelsUrl || "")})'>Hotel</button>
          <button class="primary" onclick='TS.callTool("watch_price", ${JSON.stringify({ origin: d.origin, destination: d.destination, departure_date: p.departureDate, return_date: p.returnDate })}, this)'>Watch</button>
        </div>
      </div>`).join("") + `</div>`;
  } else if (kind === "dates") {
    const rs = (d.results || []).slice().sort((a, b) => a.departureDate.localeCompare(b.departureDate));
    const max = Math.max(...rs.map(r => r.price || 0), 1), min = Math.min(...rs.map(r => r.price || 1e12));
    html += `<div class="card"><div class="bars">` + rs.map(r => `<div class="bar ${r.price === min ? "min" : ""}" style="height:${Math.max(6, 100 * (r.price || 0) / max)}%"><span>${money(r.price, cur)}</span></div>`).join("") +
            `</div><div class="labels">` + rs.map(r => `<div>${day(r.departureDate).replace(",", "")}</div>`).join("") + `</div></div>`;
    if (d.cheapest) html += `<div class="grid" style="margin-top:12px"><div class="card best"><div class="badge">CHEAPEST DAY</div>
        <div class="price">${money(d.cheapest.price, cur)}</div><div class="row"><span class="strong">${day(d.cheapest.departureDate)}${d.cheapest.returnDate ? " → " + day(d.cheapest.returnDate) : ""}</span></div>
        ${flightLine(d.cheapest.flight)}
        <div class="btns"><button onclick='TS.openLink(${JSON.stringify(d.cheapest.url || "")})'>Open</button>
        <button class="primary" onclick='TS.callTool("watch_price", ${JSON.stringify({ origin: d.origin, destination: d.destination, departure_date: d.cheapest.departureDate, return_date: d.cheapest.returnDate })}, this)'>Watch</button></div></div></div>`;
  } else if (kind === "flights") {
    html += `<div class="grid">` + (d.flights || []).map((f, i) => `<div class="card ${i === 0 ? "best" : ""}">${i === 0 ? '<div class="badge">CHEAPEST</div>' : ""}
        <div class="price">${money(f.price, cur)}</div>${flightLine(f)}</div>`).join("") + `</div>`;
    if (d.url) html += `<div class="btns"><button onclick='TS.openLink(${JSON.stringify(d.url)})'>Open in Google Flights</button>
        <button class="primary" onclick='TS.callTool("watch_price", ${JSON.stringify({ origin: d.origin, destination: d.destination, departure_date: d.departureDate, return_date: d.returnDate })}, this)'>Watch this price</button></div>`;
  } else if (kind === "hotels") {
    html += `<div class="grid">` + (d.hotels || []).map((h, i) => `<div class="card ${i === 0 ? "best" : ""}">${i === 0 ? '<div class="badge">TOP PICK</div>' : ""}
        ${h.photo ? `<img class="photo" src="${esc(h.photo)}" alt="">` : ""}
        <div class="price">${money(h.pricePerNight, cur)} <small>/ night</small></div>
        <div class="row"><span class="strong">${esc(h.name)}</span></div>
        <div class="row"><span>★ ${h.rating ?? "–"} · ${h.reviewCount ?? 0} reviews</span><span>${h.hotelClass ? h.hotelClass + "-star" : ""}</span></div>
        <div class="row"><span>${esc((h.highlights || []).join(" · "))}</span><span>${money(h.priceTotal, cur)} total</span></div>
        <div class="btns"><button onclick='TS.openLink(${JSON.stringify(h.googleHotelsUrl || "")})'>Details</button></div></div>`).join("") + `</div>`;
  } else if (kind === "demo-trip" || kind === "provider-fallback" || kind === "demo-rescue") {
    const moneyEur = n => `€${Number(n || 0).toLocaleString("en-IE")}`;
    const stopsFor = trip => (trip.itinerary.days || []).flatMap(dayPlan => dayPlan.stops || []);
    const renderTrip = (trip, label, key, changed = new Set()) => {
      const panels = (trip.itinerary.days || []).map(dayPlan => `<section class="day-panel" id="${key}-day-${dayPlan.day}" role="tabpanel" tabindex="0" aria-labelledby="${key}-tab-${dayPlan.day}" ${dayPlan.day > 1 ? "hidden" : ""}>
        ${(dayPlan.stops || []).length ? dayPlan.stops.map(s => `<article class="activity ${changed.has(s.name) ? "changed" : ""}"><div class="activity-time">${esc(s.start)}–${esc(s.end)}</div><div><h3>${esc(s.name)}</h3><p>${esc(s.area)} · ${s.travelMinutes} min travel · ${s.minutes} min visit</p><p>${esc(s.reason)}</p>${changed.has(s.name) ? `<div class="change-note">${key === "before" ? "Replaced after the simulated closure." : "Added as an interest-matched replacement."}</div>` : ""}</div><div class="activity-cost">${moneyEur(s.cost)}</div></article>`).join("") : `<div class="empty">No activities fit this day and budget.</div>`}
        </section>`).join("");
      return `<section class="card trip-card" aria-label="${label} itinerary"><div class="badge">${label}</div>
        <div class="eyebrow">${trip.days} days · ${trip.travelers} travelers</div><div class="row"><span>Estimated total</span><span class="strong">${moneyEur(trip.estimatedTotal)}</span></div>
        <div class="row"><span>Budget remaining</span><span class="strong">${moneyEur(trip.remainingBudget)} of ${moneyEur(trip.budget)}</span></div>
        <div class="row"><span>Local travel estimate</span><span class="strong">${trip.estimatedTravelMinutes} min</span></div>
        <details class="assumptions"><summary>Cost breakdown & assumptions</summary><ul>${Object.entries(trip.costBreakdown || {}).map(([key, val]) => `<li>${esc(key.replace(/[A-Z]/g, m => " " + m).replace(/^./, c => c.toUpperCase()))}: ${moneyEur(val)}</li>`).join("")}</ul><p>${Object.values(trip.costAssumptions || {}).map(esc).join(" · ")}</p></details>
        <nav class="day-nav" role="tablist" aria-label="${label} itinerary days">${(trip.itinerary.days || []).map(dayPlan => `<button type="button" role="tab" id="${key}-tab-${dayPlan.day}" tabindex="${dayPlan.day === 1 ? 0 : -1}" aria-selected="${dayPlan.day === 1}" aria-controls="${key}-day-${dayPlan.day}" data-day-group="${key}" data-day="${dayPlan.day}">Day ${dayPlan.day}</button>`).join("")}</nav>${panels}</section>`;
    };
    if (kind === "demo-rescue") {
      const dc = d.changes || {};
      const changeLabel = (value, unit, lower, higher) => value === 0 ? `unchanged (${unit === "€" ? "€0" : "0 min"})` : `${unit === "€" ? "€" + Math.abs(value) : Math.abs(value) + " min"} ${value < 0 ? lower : higher}`;
      const beforeNames = new Set(stopsFor(d.before).map(s => s.name));
      const afterNames = new Set(stopsFor(d.after).map(s => s.name));
      const removed = new Set([...beforeNames].filter(name => !afterNames.has(name)));
      const added = new Set([...afterNames].filter(name => !beforeNames.has(name)));
      html += `<div class="card disruption"><div class="eyebrow">Simulated disruption</div><h2>${esc(d.disruption)}</h2><div class="sub">RoamReady removed the unavailable stop and rebuilt the affected plan around your interests. No live venue status is connected.</div>
        <div class="metrics"><div class="metric"><span>Estimated trip total</span><strong>${moneyEur(d.before.estimatedTotal)} → ${moneyEur(d.after.estimatedTotal)}<br><em>${changeLabel(dc.estimatedCostDelta, "€", "less", "more")}</em></strong></div>
        <div class="metric"><span>Budget remaining</span><strong>${moneyEur(d.before.remainingBudget)} → ${moneyEur(d.after.remainingBudget)}<br><em>${changeLabel(dc.remainingBudgetDelta, "€", "less", "more")}</em></strong></div>
        <div class="metric"><span>Estimated local travel</span><strong>${d.before.estimatedTravelMinutes} → ${d.after.estimatedTravelMinutes} min<br><em>${changeLabel(dc.travelMinutesDelta, "min", "fewer", "more")}</em></strong></div></div>
        <p class="data-note">${esc(d.dataLabel || "Illustrative estimates only.")}</p></div>`;
      html += `<div class="comparison-trips">${renderTrip(d.before, "Original plan", "before", removed)}${renderTrip(d.after, "Revised plan", "after", added)}</div>`;
    } else {
      if (kind === "provider-fallback") html += `<div class="card"><div class="eyebrow" role="status" aria-live="polite">Simulated provider failure · recovered offline</div><div>${esc(d.failure || "Provider unavailable")}</div></div>`;
      html += renderTrip(d, "SIMULATED TRIP ESTIMATE", "trip");
    }
    html += `<div class="sub">${esc(d.dataLabel || "All values are illustrative estimates, not live availability or quotes.")}</div>`;
  } else if (kind === "itinerary" || kind === "rescue") {
    const itinerary = kind === "rescue" ? (d.itinerary || {}) : d;
    if (kind === "rescue") html += `<div class="card"><div class="badge">DISRUPTION RESCUE · SIMULATED</div><div class="strong">${esc(d.disruption || "Disruption")}</div><ul class="steps">${(d.changes || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    html += `<div class="row"><span>Activity estimate: €${Number(itinerary.estimatedActivityCost || 0).toLocaleString("en-IE")} / €${Number(itinerary.budget || 0).toLocaleString("en-IE")}</span><span>${itinerary.estimatedTravelMinutes || 0} min travel</span></div>`;
    html += `<div class="sub">${esc(itinerary.dataLabel || "Illustrative estimates")}</div>`;
    html += `<div class="grid">` + (itinerary.days || []).map(dayPlan => `<div class="card"><div class="badge">DAY ${dayPlan.day}</div>` + (dayPlan.stops || []).map(s => `<div class="row"><span class="strong">${esc(s.start)} · ${esc(s.name)}</span><span>€${Number(s.cost || 0).toLocaleString("en-IE")}</span></div><div class="row"><span>${esc(s.area)} · ${s.travelMinutes} min travel · ${s.minutes} min visit</span></div><div class="sub">${esc(s.reason)} · hours ${esc(s.open)}</div>`).join("") + `</div>`).join("") + `</div>`;
  } else if (kind === "watches") {
    html += (d.watches || []).length ? `<div class="grid">` + d.watches.map(w => {
      const diff = (w.lastPrice != null && w.firstPrice != null) ? w.lastPrice - w.firstPrice : 0;
      return `<div class="card ${diff < 0 ? "best" : ""}">${diff < 0 ? '<div class="badge">PRICE DROP</div>' : ""}
        <div class="row"><span class="strong">${esc(w.label)}</span></div>
        <div class="price">${money(w.lastPrice, w.currency)}</div>
        <div class="row"><span>was ${money(w.firstPrice, w.currency)}</span><span class="${diff < 0 ? "drop" : diff > 0 ? "up" : ""}">${diff === 0 ? "no change" : (diff < 0 ? "▼ " : "▲ ") + money(Math.abs(diff), w.currency)}</span></div>
        <div class="row"><span>best seen ${money(w.bestPrice, w.currency)}</span><span>${(w.history || []).length} checks</span></div>
        <div class="btns"><button onclick='TS.callTool("stop_watching", ${JSON.stringify({ watch_id: w.id })}, this)'>Stop watching</button></div></div>`; }).join("") + `</div>`
      : `<div class="empty">You are not watching any prices yet.</div>`;
  } else {
    html += `<div class="card">${esc(d.speech || JSON.stringify(d))}</div>`;
  }
  if (d.steps && d.steps.length) html += `<ul class="steps">` + d.steps.map(s => `<li>${esc(s)}</li>`).join("") + `</ul>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-day-group]").forEach(tab => {
    const selectDay = () => {
    const group = tab.dataset.dayGroup, selected = tab.dataset.day;
    app.querySelectorAll(`[data-day-group="${group}"]`).forEach(button => { button.setAttribute("aria-selected", String(button === tab)); button.tabIndex = button === tab ? 0 : -1; });
    app.querySelectorAll(`[id^="${group}-day-"]`).forEach(panel => { panel.hidden = panel.id === `${group}-day-${selected}` ? false : true; });
    };
    tab.addEventListener("click", selectDay);
    tab.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const groupTabs = [...app.querySelectorAll(`[data-day-group="${tab.dataset.dayGroup}"]`)];
      const index = groupTabs.indexOf(tab);
      const next = event.key === "Home" ? 0 : event.key === "End" ? groupTabs.length - 1 : (index + (event.key === "ArrowRight" ? 1 : -1) + groupTabs.length) % groupTabs.length;
      groupTabs[next].focus(); groupTabs[next].click();
    });
  });
}

// size reporting for flexible containers
new ResizeObserver(() => notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight })).observe(document.body);

(async () => {
  try {
    await request("ui/initialize", { protocolVersion: "2026-01-26", clientInfo: { name: "roamready-ai-view", version: "0.1.0" },
                                     appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] } });
  } catch (e) {}
  notify("ui/notifications/initialized", {});
})();
</script>
